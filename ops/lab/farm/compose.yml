# The lab's farm profile: Home Assistant stand-in with simulated Ecowitt GW3000 + WS90 + WH51
# sensors, and the read-only Field Station cell (M10) built from this checkout.
name: ${LAB_PROJECT:-alab}-farm

networks:
  lab:
    name: ${LAB_NETWORK:-autonomy-lab}
    external: true

services:
  ha:
    profiles: [stub]
    build: {context: ./ha-stub}
    image: alab-ha-stub:lab
    container_name: ${LAB_PROJECT:-alab}-ha
    labels: {autonomy.lab: "true"}
    environment:
      - HA_TOKEN=lab-ha-token
      - SIM_TICK=5
    networks: [lab]
    restart: unless-stopped

  # --farm-config: a real Home Assistant (profile "real") loading the farm_automation repository's
  # homeassistant/ packages. Same container name, so the station finds it at the same address.
  ha-real:
    profiles: [real]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ${LAB_PROJECT:-alab}-ha
    labels: {autonomy.lab: "true"}
    volumes:
      - ${LAB_STATE:?}/ha-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8123/manifest.json"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [lab]
    restart: unless-stopped

  station:
    build: {context: "${LAB_AUTONOMY_DIR:?}", dockerfile: ops/lab/farm/station.Dockerfile}
    image: alab-station:lab
    container_name: ${LAB_PROJECT:-alab}-station
    labels: {autonomy.lab: "true"}
    environment:
      - HA_TOKEN=${LAB_HA_TOKEN:-lab-ha-token}
    volumes:
      - ${LAB_STATE:?}/config:/config:ro
      - station-data:/data
      - ${LAB_STATE:?}/status:/status
    networks: [lab]
    restart: unless-stopped # lab.sh starts it after Home Assistant is healthy (and has a token)

volumes:
  station-data: {}
