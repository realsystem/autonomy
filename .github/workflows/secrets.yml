name: secrets

# IT-81: no secrets in git. Runs the Autonomy secret scanner (core/python) over the whole
# repository on every PR and push to main. Expected test data is listed in .secrets-allowlist.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./core/python
      - name: Scan the repository
        run: autonomy secrets scan . --allowlist .secrets-allowlist
      - name: Gitleaks over the full git history
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2
          git --config /repo/.gitleaks.toml --redact --verbose /repo
      - name: SOPS-encrypted files stay encrypted
        run: |
          mapfile -t files < <(git ls-files '*.enc.json' '*.enc.yaml' '*.enc.yml')
          if [ "${#files[@]}" -gt 0 ]; then
            pip install pyyaml && autonomy secrets check-sops "${files[@]}"
          else
            echo "no *.enc.* files"
          fi
