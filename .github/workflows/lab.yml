name: Lab

# The whole lab (design/lab.md): processor + edge_server + this repo's orchestrator, with a
# mocked Telegram API and a fake model. Real containers, no real model, no hardware.
# processor is public now, so the full lab (processor + edge_server + this repo) needs no secret and
# runs on every lab or core change. farm_automation is private (and Actions in a private repository
# needs GitHub billing), so the nightly four-repository run uses a repository secret
# LAB_REPOS_TOKEN: a fine-grained personal access token, resource owner realsystem, repository
# farm_automation, permission "Contents: read" only. Without it that job is skipped.
#
#   every PR / push that touches the lab or core:  lab (processor + edge_server + this repo)
#   nightly and on demand:                         lab-farm-config (all four, real Home Assistant)
on:
  schedule:
    - cron: "41 10 * * *" # nightly, 02:41 Pacific
  pull_request:
    paths: ["ops/lab/**", "design/lab.md", ".github/workflows/lab.yml", "core/python/**"]
  push:
    branches: [main]
    paths: ["ops/lab/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    name: lab script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ops/lab/lab.sh
      - run: shellcheck --severity=warning ops/lab/lab.sh

  farm:
    name: farm profile (Field Station)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_DIR: /tmp/autonomy-lab
    steps:
      - uses: actions/checkout@v4
      - name: Up (Home Assistant stand-in and the read-only cell, built from this checkout)
        run: ops/lab/lab.sh up --only farm
      - name: Verify the farm scenarios
        run: ops/lab/lab.sh verify farm
      - name: Logs
        if: always()
        run: ops/lab/lab.sh logs ha; ops/lab/lab.sh logs station
      - name: Reset
        if: always()
        run: ops/lab/lab.sh reset

  lab:
    name: lab up and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAB_DIR: /tmp/autonomy-lab
    steps:
      - uses: actions/checkout@v4
        with:
          path: autonomy
      - uses: actions/checkout@v4
        with:
          repository: realsystem/edge_server
          path: edge_server
      - uses: actions/checkout@v4
        with:
          repository: realsystem/processor
          path: processor
      - name: Up (builds from the three checkouts, mocked Telegram)
        run: autonomy/ops/lab/lab.sh up --mock-telegram --farm
      - name: Verify every scenario
        run: autonomy/ops/lab/lab.sh verify
      - name: Logs
        if: always()
        run: autonomy/ops/lab/lab.sh logs | tail -200
      - name: Reset
        if: always()
        run: autonomy/ops/lab/lab.sh reset

  lab-farm-config:
    name: whole stack with real Home Assistant and the farm configuration (nightly)
    # not on pull requests: it pulls the Home Assistant image (about 700 MB) and takes a while
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_TOKEN: ${{ secrets.LAB_REPOS_TOKEN != '' }}
      LAB_DIR: /tmp/autonomy-lab
    steps:
      - name: Needs the LAB_REPOS_TOKEN secret (farm_automation is private)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::LAB_REPOS_TOKEN is not set, so this job was skipped (see the workflow header)"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          path: autonomy
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: realsystem/edge_server
          path: edge_server
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: realsystem/processor
          path: processor
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: realsystem/farm_automation
          path: farm_automation
          token: ${{ secrets.LAB_REPOS_TOKEN }}
      - name: Up (four checkouts, real Home Assistant loading farm_automation's packages)
        if: env.HAS_TOKEN == 'true'
        run: autonomy/ops/lab/lab.sh up --mock-telegram --farm-config
      - name: Verify every scenario (the farm-config ones replace the stand-in's)
        if: env.HAS_TOKEN == 'true'
        run: autonomy/ops/lab/lab.sh verify
      - name: Logs
        if: always() && env.HAS_TOKEN == 'true'
        run: autonomy/ops/lab/lab.sh logs | tail -300; autonomy/ops/lab/lab.sh logs ha | tail -100
      - name: Reset
        if: always() && env.HAS_TOKEN == 'true'
        run: autonomy/ops/lab/lab.sh reset
